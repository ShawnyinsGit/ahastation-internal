# build-matrix.yml — Phase 6b CI matrix (supersedes build.yml).
#
# x64 three runners (mac/win/ubuntu) build on push/PR; linux-arm64 is
# MANUAL (workflow_dispatch) because this repo is private and arm runners
# burn paid minutes. Every job runs both typechecks + the full node --test
# suite + the whisper asset assertion (no more silently whisper-less
# packages). Tag pushes (v*) additionally create a GitHub Release with all
# artifacts + latest*.yml via GITHUB_TOKEN.
#
# Update-feed note (private-repo downgrade, docs §3.5-5): latest*.yml is
# uploaded for the day the repo goes public; electron-updater itself is
# NOT wired (private releases need a token the client can't have). The
# in-app version check does an unauthenticated redirect probe and
# no-ops while the repo stays private.

name: build-matrix

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  VIBE_MEET_CACHE_DIR: ${{ github.workspace }}/.asset-cache

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache build assets
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: assets-${{ matrix.os }}-${{ hashFiles('scripts/lib/whisper-platforms.mjs', 'scripts/fetch-speaker-model.mjs') }}
          restore-keys: assets-${{ matrix.os }}-

      - name: Install whisper-cpp (macOS Homebrew)
        if: matrix.os == 'macos-latest'
        run: brew install whisper-cpp

      - name: npm install
        run: npm ci

      - name: Prebuild — whisper binaries (fatal on failure)
        run: node scripts/fetch-whisper.mjs

      - name: Prebuild — speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild — claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Assert whisper assets (CI gate)
        run: node scripts/assert-whisper-assets.mjs

      - name: Typecheck (renderer)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: Typecheck (electron)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.electron.json

      - name: Test suite
        run: npm test

      - name: Package (macOS dmg, unsigned in CI)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Package (Windows nsis)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Package (Linux AppImage + deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Report package + model sizes
        shell: bash
        run: |
          # NOTE: build/whisper/ggml-small-q5_1.bin (~190 MB) ships INSIDE
          # every package (extraResources). First-run on-demand download
          # with hash verification is a follow-up (docs §3.5-2).
          du -sh build/whisper || true
          ls -lh release/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  linux-arm64:
    name: debian-11-arm64
    # Private repo: arm runners consume paid minutes. Run manually during
    # development and make it mandatory for release tags.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:11
    timeout-minutes: 90
    steps:
      - name: Bootstrap Debian 11 build environment
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl file git libarchive-tools \
            python3 rpm xz-utils

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm ci

      - name: Prebuild — static whisper.cpp ARM64 + model
        run: npm run prebuild:whisper:linux-arm64

      - name: Prebuild — speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild — claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Assert whisper assets (CI gate)
        run: node scripts/assert-whisper-assets.mjs

      - name: Typecheck (renderer)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: Typecheck (electron)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.electron.json

      - name: Test suite
        run: npm test

      - name: Package (Linux arm64 AppImage + deb)
        run: npx electron-builder --linux --arm64 --publish never

      - name: Verify Debian 11 / arm64 package closure
        run: node scripts/verify-linux-arm64-package.mjs

      - name: Generate SHA-256 manifest
        run: node scripts/generate-release-manifest.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-test')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Import release signing key
        env:
          AHASTATION_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.AHASTATION_RELEASE_GPG_PRIVATE_KEY }}
        run: |
          test -n "$AHASTATION_RELEASE_GPG_PRIVATE_KEY"
          printf '%s' "$AHASTATION_RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Generate and sign release manifest
        env:
          AHASTATION_RELEASE_GPG_KEY_ID: ${{ secrets.AHASTATION_RELEASE_GPG_KEY_ID }}
        run: node scripts/generate-release-manifest.mjs --dir artifacts --require-signature

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: AhaMeet ${{ github.ref_name }}
          # Draft=false but prerelease honored for tags like v1.2.0-beta.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/pkg-macos-latest/*.dmg
            artifacts/pkg-macos-latest/latest*.yml
            artifacts/pkg-windows-latest/*.exe
            artifacts/pkg-windows-latest/latest*.yml
            artifacts/pkg-ubuntu-latest/*.AppImage
            artifacts/pkg-ubuntu-latest/*.deb
            artifacts/pkg-ubuntu-latest/latest*.yml
            artifacts/pkg-linux-arm64/*.AppImage
            artifacts/pkg-linux-arm64/*.deb
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
