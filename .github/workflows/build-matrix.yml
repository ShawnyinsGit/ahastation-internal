# build-matrix.yml — Phase 6b CI matrix (supersedes build.yml).
#
# x64 three runners (mac/win/ubuntu) build on push/PR; linux-arm64 is
# MANUAL (workflow_dispatch) because this repo is private and arm runners
# burn paid minutes. Every job runs both typechecks + the full node --test
# suite + the whisper asset assertion (no more silently whisper-less
# packages). Tag pushes (v*) additionally create a GitHub Release with all
# artifacts + latest*.yml via GITHUB_TOKEN.
#
# Update-feed note (private-repo downgrade, docs §3.5-5): latest*.yml is
# uploaded for the day the repo goes public; electron-updater itself is
# NOT wired (private releases need a token the client can't have). The
# in-app version check does an unauthenticated redirect probe and
# no-ops while the repo stays private.

name: build-matrix

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  VIBE_MEET_CACHE_DIR: ${{ github.workspace }}/.asset-cache

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache build assets
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: assets-${{ matrix.os }}-${{ hashFiles('scripts/lib/whisper-platforms.mjs', 'scripts/fetch-speaker-model.mjs') }}
          restore-keys: assets-${{ matrix.os }}-

      - name: Install whisper-cpp (macOS Homebrew)
        if: matrix.os == 'macos-latest'
        run: brew install whisper-cpp

      - name: npm install
        run: npm ci

      - name: Prebuild — whisper binaries (fatal on failure)
        run: node scripts/fetch-whisper.mjs

      - name: Prebuild — speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild — claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Assert whisper assets (CI gate)
        run: node scripts/assert-whisper-assets.mjs

      - name: Typecheck (renderer)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: Typecheck (electron)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.electron.json

      - name: Test suite
        run: npm test

      - name: Package (macOS dmg, unsigned in CI)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Package (Windows nsis)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Package (Linux AppImage + deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Report package + model sizes
        shell: bash
        run: |
          # NOTE: build/whisper/ggml-small-q5_1.bin (~190 MB) ships INSIDE
          # every package (extraResources). First-run on-demand download
          # with hash verification is a follow-up (docs §3.5-2).
          du -sh build/whisper || true
          ls -lh release/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  linux-arm64:
    name: ubuntu-24.04-arm (manual)
    # Private repo: arm runners consume paid minutes — manual trigger only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build whisper.cpp v1.9.1 from source (NEON self-build)
        # Official prebuilts are x64-only; arm64 must compile. Produces
        # build/whisper/{whisper-cli,whisper-server,libggml*.so}.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git ca-certificates
          mkdir -p build
          if [ ! -d build/whisper.cpp-src ]; then
            git clone --depth 1 --branch v1.9.1 https://github.com/ggerganov/whisper.cpp.git build/whisper.cpp-src
          fi
          cmake -S build/whisper.cpp-src -B build/whisper.cpp-src/build \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DBUILD_SHARED_LIBS=ON
          cmake --build build/whisper.cpp-src/build --config Release -j --target whisper-cli whisper-server
          mkdir -p build/whisper
          cp build/whisper.cpp-src/build/bin/whisper-* build/whisper/ || true
          find build/whisper.cpp-src/build -name 'libggml*.so' -exec cp {} build/whisper/ \;
          chmod +x build/whisper/whisper-* || true

      - name: npm install
        run: npm ci

      - name: Prebuild — whisper model only (binaries self-built above)
        run: node scripts/fetch-whisper.mjs

      - name: Prebuild — speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild — claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Assert whisper assets (CI gate)
        run: node scripts/assert-whisper-assets.mjs

      - name: Typecheck (renderer)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: Typecheck (electron)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.electron.json

      - name: Test suite
        run: npm test

      - name: Package (Linux arm64 AppImage + deb — UNVERIFIED target)
        # arm64 AppImage/deb targets exist in electron-builder.json but are
        # unverified on real hardware (docs §3.5-1); this job is the
        # verification path.
        run: npx electron-builder --linux --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-test')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: AhaMeet ${{ github.ref_name }}
          # Draft=false but prerelease honored for tags like v1.2.0-beta.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/pkg-macos-latest/*.dmg
            artifacts/pkg-macos-latest/latest*.yml
            artifacts/pkg-windows-latest/*.exe
            artifacts/pkg-windows-latest/latest*.yml
            artifacts/pkg-ubuntu-latest/*.AppImage
            artifacts/pkg-ubuntu-latest/*.deb
            artifacts/pkg-ubuntu-latest/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
