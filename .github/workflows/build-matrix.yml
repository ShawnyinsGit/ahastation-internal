# build-matrix.yml - Phase 6b CI matrix (supersedes build.yml).
#
# x64 three runners (mac/win/ubuntu) build on push/PR; linux-arm64 runs on
# workflow_dispatch AND tag pushes (private repo: arm runners burn paid
# minutes) INSIDE a debian:11 container on the arm runner - it builds the
# arm64 deb on the RK3588 / LubanCat target glibc (2.31) and smoke-verifies
# it by dpkg-installing + headless-launching in that same Debian 11
# environment. Every job runs both typechecks + the full node --test suite.
# Tag pushes (v*) additionally create a GitHub Release with ALL artifacts
# (x64 + arm64) + latest*.yml via GITHUB_TOKEN.
#
# Update-feed note (private-repo downgrade, docs §3.5-5): latest*.yml is
# uploaded for the day the repo goes public; electron-updater itself is
# NOT wired (private releases need a token the client can't have). The
# in-app version check does an unauthenticated redirect probe and
# no-ops while the repo stays private.

name: build-matrix

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  VIBE_MEET_CACHE_DIR: ${{ github.workspace }}/.asset-cache

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache build assets
        uses: actions/cache@v4
        with:
          path: .asset-cache
          key: assets-${{ matrix.os }}-${{ hashFiles('scripts/fetch-speaker-model.mjs') }}
          restore-keys: assets-${{ matrix.os }}-

      - name: npm install
        run: npm ci

      - name: Prebuild - speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild - claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Typecheck (renderer)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: Typecheck (electron)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.electron.json

      - name: Test suite
        run: npm test

      - name: Package (macOS dmg, unsigned in CI)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Package (Windows nsis)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Package (Linux AppImage + deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Report package sizes
        shell: bash
        run: |
          ls -lh release/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  linux-arm64:
    name: linux-arm64 (debian:11 container)
    # Private repo: arm runners consume paid minutes - manual trigger and
    # tag pushes only (tags need the arm64 deb/AppImage for the release).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    # Build inside Debian 11 (glibc 2.31 - RK3588 / LubanCat target per
    # docs/RK3588_DEPLOYMENT.md) so the deb is produced AND smoke-verified
    # on the exact board distro. The package gate also rejects ELF symbols
    # newer than GLIBC_2.31.
    container: debian:11
    timeout-minutes: 90
    steps:
      # debian:11 ships no git/curl/node - install before checkout (checkout
      # needs git) and npm ci / electron-builder need the rest:
      # python3/make/g++ (native npm modules), libfuse2 (appimagetool runs
      # in a fuse-less docker container).
      - name: Install container build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils python3 make g++ libfuse2

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: npm ci

      - name: Prebuild - speaker model
        run: node scripts/fetch-speaker-model.mjs

      - name: Prebuild - claude defaults
        run: node scripts/bundle-claude-defaults.mjs

      - name: Typecheck (renderer)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json

      - name: Typecheck (electron)
        run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.electron.json

      - name: Test suite
        run: npm test

      - name: Package (Linux arm64 AppImage + deb)
        # Built inside debian:11; the smoke step below installs and launches
        # the deb on the board target distro (docs/RK3588_DEPLOYMENT.md).
        run: npx electron-builder --linux --arm64 --publish never

      - name: Smoke test - dpkg install + headless launch (Debian 11 gate)
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(ls release/*arm64*.deb release/ahastation_*_arm64.deb 2>/dev/null | head -n1)"
          echo "Installing $DEB - apt resolves Depends (libgtk-3-0, libnss3, libasound2, …)"
          apt-get install -y "./$DEB"
          BIN=/opt/AhaStation/ahastation
          test -x "$BIN"
          # Container is root with no display: --no-sandbox is required as
          # root, --disable-gpu avoids GPU init. --version prints and exits
          # before Electron brings up the UI. If that still fails headless,
          # fall back to a full dynamic-link check of the installed binary.
          if "$BIN" --no-sandbox --disable-gpu --version; then
            echo "smoke OK: $BIN launched and printed a version"
          else
            echo "--version failed headless - falling back to ldd link check"
            if ldd "$BIN" | grep "not found"; then
              echo "smoke FAILED: unresolved shared libraries on Debian 11"
              exit 1
            fi
            echo "smoke OK: all shared libraries resolve"
          fi

      - name: Verify Linux arm64 package closure
        run: node scripts/verify-linux-arm64-package.mjs

      - name: Generate SHA-256 manifest
        run: node scripts/generate-release-manifest.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-arm64
          path: |
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-test')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Import release signing key
        env:
          AHASTATION_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.AHASTATION_RELEASE_GPG_PRIVATE_KEY }}
        run: |
          test -n "$AHASTATION_RELEASE_GPG_PRIVATE_KEY"
          printf '%s' "$AHASTATION_RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Generate and sign release manifest
        env:
          AHASTATION_RELEASE_GPG_KEY_ID: ${{ secrets.AHASTATION_RELEASE_GPG_KEY_ID }}
        run: node scripts/generate-release-manifest.mjs --dir artifacts --require-signature

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: AhaStation ${{ github.ref_name }}
          # Draft=false but prerelease honored for tags like v1.2.0-beta.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/pkg-macos-latest/*.dmg
            artifacts/pkg-macos-latest/latest*.yml
            artifacts/pkg-windows-latest/*.exe
            artifacts/pkg-windows-latest/latest*.yml
            artifacts/pkg-ubuntu-latest/*.AppImage
            artifacts/pkg-ubuntu-latest/*.deb
            artifacts/pkg-ubuntu-latest/latest*.yml
            artifacts/pkg-linux-arm64/*.AppImage
            artifacts/pkg-linux-arm64/*.deb
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
